---
- name: Patch and Update Debian LXC Containers
  hosts: tag_autopatch
  gather_facts: true
  remote_user: root

  vars:
    auto_reboot: true
    reboot_timeout: 300

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all installed packages to latest versions
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Check if a system reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot server if kernel/core libraries updated
      ansible.builtin.reboot:
        msg: "Rebooting post-patching (Debian package upgrade)"
        connect_timeout: 5
        reboot_timeout: "{{ reboot_timeout }}"
        pre_reboot_delay: 5
        post_reboot_delay: 15
        test_command: uptime
      when:
        - reboot_required_file.stat.exists
        - auto_reboot | bool
